name: Build and Deploy Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-deploy:
    name: Build and Push to S3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install deps
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - name: Deploy to S3
        env:
          NODE_AWS_ACCESS_KEY: ${{ secrets.NODE_AWS_ACCESS_KEY }}
          NODE_AWS_SECRET_KEY: ${{ secrets.NODE_AWS_SECRET_KEY }}
          NODE_AWS_S3_BUCKET: ${{ secrets.NODE_AWS_S3_BUCKET }}
          NODE_AWS_S3_REGION: ${{ secrets.NODE_AWS_S3_REGION }}
          NODE_AWS_S3_ENDPOINT: ${{ secrets.NODE_AWS_S3_ENDPOINT }}
        run: node scripts/deploy-s3.js
